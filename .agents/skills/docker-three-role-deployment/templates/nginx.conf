# Schematic! Replace app.example.invalid with the approved public DNS name.
# Assumes ONLY a trusted HTTPS corporate reverse proxy can reach this gateway.
# When ingress topology differs, rewrite scheme/Host handling and validate it.
events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream private_frontend { server frontend:8080; }
    upstream identity_gate   { server auth:4180; }

    # Explicitly reject unknown Host headers (no wildcard dynamic redirect).
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 80;
        server_name app.example.invalid;
        client_max_body_size 10m;  # tune only for actual upload requirements

        location /oauth2/ {
            proxy_pass http://identity_gate;
            proxy_set_header Host app.example.invalid;
            proxy_set_header X-Forwarded-Proto https;  # trusted TLS ingress only
            proxy_set_header X-Forwarded-Host app.example.invalid;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Auth-Request-Redirect https://app.example.invalid$request_uri;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass http://identity_gate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host app.example.invalid;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host app.example.invalid;
            proxy_set_header X-Forwarded-Uri $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location @start_signin {
            # Validate URL encoding and redirect/Host allowlists for the actual IdP.
            return 302 /oauth2/start?rd=https://app.example.invalid$request_uri;
        }

        location / {
            auth_request /oauth2/auth;
            error_page 401 = @start_signin;

            auth_request_set $verified_user $upstream_http_x_auth_request_user;
            auth_request_set $auth_cookie $upstream_http_set_cookie;
            add_header Set-Cookie $auth_cookie always;

            proxy_pass http://private_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host app.example.invalid;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host app.example.invalid;
            proxy_set_header X-Auth-Request-User $verified_user;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
# If OAuth2 Proxy emits multiple auth-refresh Set-Cookie headers, this simple
# auth_request_set example may not forward every cookie. Follow your installed
# oauth2-proxy Nginx integration docs; never silently break session refresh.
# For machine APIs, use an explicit path returning 401/403 rather than redirects.
